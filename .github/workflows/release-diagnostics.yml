name: Release verification diagnostics

on: workflow_dispatch

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: 21
      - name: Inspect only the public stable APK
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 \
            https://github.com/getmikan/MikanApp/releases/download/v0.1.3/mikan-alpha-arm64-v8a.apk \
            --output stable.apk
          tools="$(dirname "$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)")"
          echo "Selected Android tools: $tools"
          signing="$("$tools/apksigner" verify --verbose --print-certs stable.apk)"
          printf '%s\n' "$signing" | grep -E '^Signer #[0-9]+ certificate (DN|SHA-256 digest):|^Verified using'
          if grep -Fxq 'Signer #1 certificate SHA-256 digest: 33dda52638af204dc81726c0e8e230556904a6d46d90e4938102a09c0b42bd83' <<< "$signing"; then
            echo 'Certificate guard passed'
          else
            echo 'Certificate guard failed'
          fi
          badging="$("$tools/aapt" dump badging stable.apk)"
          printf '%s\n' "$badging" | sed -n '1,3p'
          expected="package: name='com.nemu.clashfest.clash.alpha' versionCode='10201012' versionName='0.1.3'"
          if [[ "$badging" == "$expected"* ]]; then
            echo 'Manifest guard passed'
          else
            echo 'Manifest guard failed'
          fi
          if "$tools/zipalign" -c -p 4 stable.apk; then
            echo 'Alignment guard passed'
          else
            echo 'Alignment guard failed'
          fi
