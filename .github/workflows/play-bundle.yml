name: Play Bundle

# Signed Android App Bundle for Google Play. Same package and signing key as the GitHub release
# (com.nemu.clashfest.clash.alpha, alphaRelease), built with clashfest.selfUpdate=false: Play
# forbids an app updating itself, so the GitHub updater, its components and
# REQUEST_INSTALL_PACKAGES are left out (src/fdroid manifest overlay). Run by hand on the tag
# being shipped; the .aab is uploaded as a workflow artifact for the Play Console.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch to build (e.g. v1.2.2)"
        required: true
      adi_snippet:
        description: "Android developer verification snippet (optional): also builds a signed APK carrying assets/adi-registration.properties for the package-ownership check"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    environment: production-release

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      # Same toolchain as release.yml: MetaCubeX Go with the .github/patch GOROOT patches.
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: '1.26'
          cache: false

      - name: Apply Go runtime patches
        run: |
          cd "$(go env GOROOT)"
          for p in "$GITHUB_WORKSPACE"/.github/patch/*.patch; do
            patch --verbose -p1 < "$p"
          done
          go version

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Restore Android signing files
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Signing secrets are missing. Configure ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
          cat > signing.properties <<EOF
          keystore.password=$ANDROID_KEYSTORE_PASSWORD
          key.alias=$ANDROID_KEY_ALIAS
          key.password=$ANDROID_KEY_PASSWORD
          EOF

      - name: Guard - HandlerService must not exist
        run: |
          if grep -R --line-number --fixed-strings "HandlerService" app/src/main service/src/main core/src/main; then
            echo "HandlerService reference detected. This path is forbidden."
            exit 1
          fi
          echo "HandlerService guard passed."

      - name: Populate embedded Root CA bundle
        run: bash .github/scripts/populate-ca-bundle.sh

      # Package-name ownership check (Play Console > Android developer verification): an APK signed
      # with the release key that carries the console's snippet. The snippet is an account
      # identifier, not a secret; it is validated so the input cannot inject anything.
      - name: Add package-verification snippet
        if: inputs.adi_snippet != ''
        env:
          ADI_SNIPPET: ${{ inputs.adi_snippet }}
        run: |
          if ! [[ "$ADI_SNIPPET" =~ ^[A-Za-z0-9]+$ ]]; then
            echo "adi_snippet must be alphanumeric"
            exit 1
          fi
          mkdir -p app/src/main/assets
          printf '%s' "$ADI_SNIPPET" > app/src/main/assets/adi-registration.properties

      - name: Build Alpha Release bundle (no self-update)
        run: ./gradlew bundleAlphaRelease -Pclashfest.selfUpdate=false

      - name: Build verification APK
        if: inputs.adi_snippet != ''
        run: ./gradlew assembleAlphaRelease -Pclashfest.selfUpdate=false

      - name: Remove Android signing files
        if: always()
        run: rm -f signing.properties release.keystore

      - name: Guard - no install permission in the bundle
        run: |
          aab="$(ls app/build/outputs/bundle/alphaRelease/*.aab)"
          if unzip -p "$aab" base/manifest/AndroidManifest.xml | grep -a -q "REQUEST_INSTALL_PACKAGES"; then
            echo "REQUEST_INSTALL_PACKAGES is still in the manifest; Play would reject the bundle."
            exit 1
          fi
          echo "Install-permission guard passed: $aab"

      - name: Upload bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clashfest-play-aab
          path: app/build/outputs/bundle/alphaRelease/*.aab
          if-no-files-found: error

      - name: Upload verification APK
        if: inputs.adi_snippet != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: clashfest-verification-apk
          path: app/build/outputs/apk/alpha/release/*-universal-release.apk
          if-no-files-found: error
