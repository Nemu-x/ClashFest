# Source: getmikan/Citrus@b0f91a16 docs/config.yaml lines 1077-1119 (vless-xdrive; the template service at 1090 and 1106-1119, commented out there)
# License: GPL-3.0 (Citrus, like ClashFest). Copied as test data.
# Changes from the source (ClashFest):
#   - service template with the commented-out template object uncommented, wrapped into a minimal profile
#   - the `REPLACE_WITH_SERVER_PUBLIC_KEY` placeholder in `encryption` replaced by the vless-encryption value of config-proxies.yaml
#   - remote-folder and secrets set for the template (folder name, basic-auth user and password)

proxies:
  - name: "vless-xdrive"
    type: vless
    server: storage-node
    port: 443
    uuid: 27848739-7e62-4138-9fd3-098a63964b6b
    network: xdrive
    udp: true
    encryption: "mlkem768x25519plus.native.0rtt.XKbaq1BuzJKKKPxZbwgRpn-gYQbnhrYketgezASCL1I"
    client-fingerprint: chrome
    xdrive-opts:
      service: template
      remote-folder: folder
      secrets: [user, password]
      template:
        flatten: true
        auth:
          type: basic
          username: "{secret0}"
          password: "{secret1}"
        put: { method: PUT, url: "https://storage.example/{folder}/{name}" }
        get: { method: GET, url: "https://storage.example/{folder}/{name}" }
        delete: { method: DELETE, url: "https://storage.example/{folder}/{name}" }
        list:
          method: PROPFIND
          url: "https://storage.example/{folder}/"
          namesRegex: '<d:href>/folder/([^<]+)</d:href>'
        retry: { status: [429, 500, 502, 503, 504] }
proxy-groups:
  - {name: GLOBAL, type: select, proxies: [vless-xdrive]}
rules:
  - MATCH,GLOBAL
